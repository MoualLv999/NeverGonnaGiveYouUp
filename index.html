<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeverGonnaGiveYouUp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', system-ui, sans-serif;
      padding: 0;
      overflow: hidden;
    }

    .fullscreen-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .fullscreen-video.active {
      display: flex;
    }

    #click-video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
      display: block;
    }

    .qq-card {
      max-width: 380px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      z-index: 1;
    }

    .card-content {
      padding: 24px 20px 28px;
      background: linear-gradient(145deg, #f9f9fc, #ffffff);
      position: relative;
      z-index: 1;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .avatar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e0e5ed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 600;
      color: #4a4a5a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 2px solid white;
    }

    .avatar-heart {
      font-size: 22px;
      color: #ff4d6d;
      margin: 0 2px;
      filter: drop-shadow(0 2px 4px rgba(255, 77, 109, 0.3));
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #1e1e2a;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title span {
      background: linear-gradient(135deg, #ff4d6d, #ff8a9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card-sub {
      color: #6b7280;
      font-size: 14px;
      margin-top: -4px;
      margin-bottom: 18px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-sub .qq-icon {
      display: inline-block;
      background: #2b7cff;
      color: white;
      border-radius: 12px;
      padding: 0 10px;
      font-size: 11px;
      line-height: 20px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .main-text {
      background: #f0f3f9;
      border-radius: 20px;
      padding: 18px 20px;
      margin: 12px 0 18px;
      border-left: 4px solid #ff4d6d;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    .main-text p {
      font-size: 17px;
      font-weight: 500;
      color: #1a1a2e;
      line-height: 1.6;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .main-text .highlight {
      background: linear-gradient(135deg, #ff4d6d, #ff7b8f);
      color: white;
      padding: 2px 12px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      display: inline-block;
      margin: 0 2px;
    }

    .main-text .emoji-big {
      font-size: 26px;
      margin-right: 4px;
    }

    .other-source {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 6px 6px 6px;
      border-top: 1px solid #edf0f5;
      margin-top: 12px;
      color: #8a8f99;
      font-size: 13px;
    }

    .other-source .left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .other-source .right {
      color: #2b7cff;
      font-weight: 500;
      background: #eef4ff;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
    }

    .footer-meta {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      color: #b0b8c4;
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    .qq-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #eef2f7;
      border-radius: 30px;
      padding: 2px 12px 2px 8px;
      font-size: 12px;
      color: #2c3e50;
    }

    .qq-badge i {
      font-style: normal;
      background: #2b7cff;
      color: white;
      border-radius: 30px;
      padding: 0 8px;
      font-size: 10px;
      line-height: 18px;
    }

    @media (max-width: 420px) {
      .card-content {
        padding: 20px 16px 24px;
      }
      .main-text p {
        font-size: 16px;
      }
    }

    video::-webkit-media-controls {
      display: none !important;
    }
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }
    video::-webkit-media-controls-panel {
      display: none !important;
    }
    video::-webkit-media-controls-play-button {
      display: none !important;
    }
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
    }
    video::-webkit-media-controls-timeline {
      display: none !important;
    }
    video::-webkit-media-controls-current-time-display {
      display: none !important;
    }
    video::-webkit-media-controls-time-remaining-display {
      display: none !important;
    }
    video::-webkit-media-controls-mute-button {
      display: none !important;
    }
    video::-webkit-media-controls-toggle-closed-captions-button {
      display: none !important;
    }
    video::-webkit-media-controls-volume-slider {
      display: none !important;
    }
    video::-webkit-media-controls-overflow-menu {
      display: none !important;
    }
    video::-webkit-media-controls-fullscreen-button {
      display: none !important;
    }
    video::-moz-media-controls {
      display: none !important;
    }
    video::-moz-media-controls-panel {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="fullscreen-video" id="fullscreenVideo">
    <video id="click-video" playsinline preload="auto" webkit-playsinline>
      <source src="NeverGonnaGiveYouUp.mp4" type="video/mp4">
      <div style="color:white; padding:20px; text-align:center;">视频加载失败<br>请确保 NeverGonnaGiveYouUp.mp4 在同一目录下</div>
    </video>
  </div>

  <div class="qq-card" id="cardWrapper">
    <div class="card-content">
      <div class="card-header">
        <div class="avatar-group">
          <div class="avatar">🐰</div>
          <div class="avatar-heart">❤️</div>
          <div class="avatar">🐻</div>
        </div>
        <div class="card-title">
          <span>情侣关系</span>
        </div>
      </div>

      <div class="card-sub">
        <span>💑 想和你建立情侣关系</span>
        <span class="qq-icon">QQ</span>
      </div>

      <div class="main-text">
        <p>
          <span class="emoji-big">✨</span>
          和我成为情侣，让
          <span class="highlight">QQ</span>
          帮我们记录每日点滴
        </p>
      </div>

      <div class="other-source">
        <span class="left">
          <span>📅</span> 从今天开始
        </span>
        <span class="right">其他来源</span>
      </div>

      <div class="footer-meta">
        <span class="qq-badge">
          <i>QQ</i> 情侣空间 · 2026
        </span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const card = document.getElementById('cardWrapper');
      const fullscreenVideo = document.getElementById('fullscreenVideo');
      const video = document.getElementById('click-video');

      let isPlaying = false;
      let isEnded = false;

      card.addEventListener('click', function(e) {
        if (isEnded) {
          return;
        }
        if (isPlaying) return;

        fullscreenVideo.classList.add('active');
        video.currentTime = 0;
        video.play().then(() => {
          isPlaying = true;
        }).catch(err => {
          console.warn('播放失败', err);
          isPlaying = false;
        });
      });

      video.addEventListener('ended', function() {
        isPlaying = false;
        isEnded = true;
        fullscreenVideo.classList.remove('active');
      });

      video.addEventListener('error', function(e) {
        console.warn('视频错误', e);
        isPlaying = false;
        isEnded = true;
        fullscreenVideo.classList.remove('active');
      });

      fullscreenVideo.addEventListener('click', function(e) {
        e.stopPropagation();
      });

      video.removeAttribute('controls');
      video.setAttribute('playsinline', 'true');
      video.setAttribute('webkit-playsinline', 'true');
    })();
  </script>
</body>
</html>
